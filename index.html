<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Israel 2026 Election Compass</title>
    <meta
      name="description"
      content="An English-language election compass for the 26th Knesset, 27 October 2026. 46 statements, five topics, a published coding matrix."
    />
    <!--
      Type is served from this origin. A stylesheet fetched from a third party
      would send every visitor's IP to that third party before the quiz loads,
      which would make the promise on the intro screen — that nothing leaves
      your browser — false. See public/fonts/README.md.
    -->
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="preload" href="/fonts/source-serif-var-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
