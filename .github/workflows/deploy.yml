name: Deploy

# Publishes to GitHub Pages. Requires Settings → Pages → Source: GitHub Actions.
# Only fires on the default branch, so feature branches never publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue rather than cancel a run already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken coding matrix must not reach production. The bank-integrity and
      # §4.6 clustering tests are the gate.
      - run: npm run typecheck
      - run: npm test

      - run: npm run build

      - name: Check the build makes no third-party request
        run: |
          if grep -rIlE 'https?://(fonts\.(googleapis|gstatic)|cdn|unpkg|jsdelivr)' dist --include='*.html' --include='*.css'; then
            echo "::error::A third-party asset reference reached the build. See public/fonts/README.md."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
