name: Deploy

# Publishes to GitHub Pages. Requires Settings → Pages → Source: GitHub Actions.
# Only fires on the default branch, so feature branches never publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue rather than cancel a run already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken coding matrix must not reach production. The bank-integrity and
      # §4.6 clustering tests are the gate.
      - run: npm run typecheck
      - run: npm test

      # Research collection is off unless this repository variable is set, so a
      # default build has no route out of the browser at all. It is a variable
      # rather than a secret because it is a public URL, and build-time rather
      # than runtime so that unsetting it removes the feature from the artifact.
      - run: npm run build
        env:
          VITE_COLLECT_ENDPOINT: ${{ vars.COLLECT_ENDPOINT }}

      - name: Check the build makes no third-party request
        run: |
          if grep -rIlE 'https?://(fonts\.(googleapis|gstatic)|cdn|unpkg|jsdelivr)' dist --include='*.html' --include='*.css'; then
            echo "::error::A third-party asset reference reached the build. See public/fonts/README.md."
            exit 1
          fi

      # The collection endpoint is the only host the app may ever contact. The
      # allowlist below is hosts that appear in the bundle as text and are
      # never fetched: an XML namespace, React's error-message links, and the
      # citations in src/data/results.ts SOURCES, which are only ever rendered
      # as links a reader can click (Knesset.tsx). Those are read from the file,
      # so adding a source never needs this list edited; any other new host
      # still fails the build.
      - name: Check no unexpected origin reached the bundle
        env:
          ENDPOINT: ${{ vars.COLLECT_ENDPOINT }}
        run: |
          allow='w3\.org|schema\.org|reactjs\.org|react\.dev|localhost|127\.0\.0\.1'
          cites=$(sed -n '/^export const SOURCES/,/^\];/p' src/data/results.ts \
            | grep -oE 'https://[a-zA-Z0-9._-]+' | sed -E 's#^https://(www\.)?##; s#\.#\\.#g' | sort -u | paste -sd'|' -)
          [ -n "$cites" ] && allow="$allow|$cites"
          host=$(printf '%s' "$ENDPOINT" | sed -E 's#^https?://##; s#/.*##; s#\.#\\.#g')
          [ -n "$host" ] && allow="$allow|$host"
          unexpected=$(grep -rhoIE 'https?://[a-zA-Z0-9._-]+' dist \
            --include='*.js' --include='*.html' --include='*.css' \
            | sort -u | grep -vE "^https?://(www\.)?($allow)" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected origins reached the build:"; printf '%s\n' "$unexpected"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
